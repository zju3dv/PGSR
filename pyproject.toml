[tool.poetry]
name = "gaussian-splatting"
version = "0.1.0"
description = "3D Gaussian Splatting for Real-Time Radiance Field Rendering"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "scene"}, {include = "utils"}, {include = "arguments"}, {include = "gaussian_renderer"}, {include = "lpipsPyTorch"}, {include = "scripts"}]

[tool.poetry.dependencies]
python = "^3.8"
plyfile = "*"
opencv-python = "*"
lpips = "*"
trimesh = "*"
numpy = "*"
torch = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=scene",
    "--cov=utils",
    "--cov=arguments", 
    "--cov=gaussian_renderer",
    "--cov=lpipsPyTorch",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-fail-under=0"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["scene", "utils", "arguments", "gaussian_renderer", "lpipsPyTorch"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "setup.py",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"